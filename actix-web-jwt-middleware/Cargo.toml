[package]
name = "actix-web-jwt-middleware"
version = "0.1.0"
authors = ["Jan Christian Grünhage <jan.christian@gruenhage.xyz>"]
edition = "2018"

[dependencies]
futures = "0.3"
futures-util = "0.3"
actix-web = "4"
jsonwebtoken = "9"
serde_json = "1"
regex = "1"
lazy_static = "1"
log = "0.4"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
