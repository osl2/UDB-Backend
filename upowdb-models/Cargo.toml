[package]
name = "upowdb-models"
version = "0.1.0"
authors = ["Jan Christian Grünhage <jan.christian@gruenhage.xyz>"]
edition = "2018"

[dependencies]
diesel = { version = "2", features = ["sqlite", "r2d2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2rs = "0.2.5"
base64 = "0.21"
rand = "0.8"
uuid = { version = "0.8", features = ["serde", "v4"] }
